
name: POCO M3 Pro 5G - OC + ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: pipiyy31/kernel_xiaomi_mt6833_1
          ref: flyme
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            gcc-9-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev make \
            python3 zip git curl

      - name: Apply CPU and GPU OC
        run: |
          python3 - <<'PY'
          import re

          cpu = 'drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6833/mtk_cpufreq_platform.c'
          s = open(cpu).read()
          s, n = re.subn(
              r'(\n[ \t]*)tag_pr_info\("%d, Settle time',
              r'\1lv = CPU_LEVEL_2; /* OC: B24G table */\1tag_pr_info("%d, Settle time',
              s, count=1)
          assert n == 1, 'CPU OC anchor missing'
          open(cpu, 'w').write(s)

          gpu = 'drivers/misc/mediatek/base/power/gpufreq_v1/mt6833/mtk_gpufreq_plat.c'
          s = open(gpu).read()
          s, n = re.subn(
              r'(\n[ \t]*)g_segment_min_opp_idx = NUM_OF_OPP_IDX - 1;',
              r'\1g_segment_max_opp_idx = 0; /* OC: full GPU OPP */\1g_segment_min_opp_idx = NUM_OF_OPP_IDX - 1;',
              s, count=1)
          assert n == 1, 'GPU OC anchor missing'
          open(gpu, 'w').write(s)
          PY

      - name: Fix old kernel build issues
        run: |
          grep -rlE --include=Makefile --include=Kbuild --include='*.mk' \
            -- '-Werror([[:space:]]|$)' drivers sound |
            xargs -r sed -i -E 's/-Werror([[:space:]]|$)/\1/g' || true

          sed -i 's/#include <clk-mux.h>/#include "clk-mux.h"/' \
            drivers/clk/mediatek/clkdbg-mt6833.c

      - name: Integrate ReSukiSU project
        run: |
          curl -fLSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            -o /tmp/resukisu-setup.sh

          bash /tmp/resukisu-setup.sh

          test -L drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Apply required Linux 4.14 manual hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(file, old, new, label):
              p = Path(file)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              p.write_text(s.replace(old, new, 1))

          # STAT HOOK
          f = 'fs/stat.c'

          replace_once(
              f,
              '#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\nSYSCALL_DEFINE4(newfstatat',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat''',
              'stat hook declarations'
          )

          replace_once(
              f,
              '''\tstruct kstat stat;
          \tint error;

          \terror = vfs_fstatat(dfd, filename, &stat, flag);''',
              '''\tstruct kstat stat;
          \tint error;
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif

          \terror = vfs_fstatat(dfd, filename, &stat, flag);''',
              'newfstatat hook'
          )

          replace_once(
              f,
              '''\tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);

          \treturn error;
          }

          SYSCALL_DEFINE4(readlinkat''',
              '''\tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif

          \treturn error;
          }

          SYSCALL_DEFINE4(readlinkat''',
              'newfstat return hook'
          )

          # 32-bit stat64 compatibility hook, when this kernel enables it.
          s = Path(f).read_text()
          if 'SYSCALL_DEFINE2(fstat64' in s:
              replace_once(
                  f,
                  '''\tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);

          \treturn error;
          }

          SYSCALL_DEFINE4(fstatat64''',
                  '''\tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif

          \treturn error;
          }

          SYSCALL_DEFINE4(fstatat64''',
                  'fstat64 return hook'
              )

              replace_once(
                  f,
                  '''\tstruct kstat stat;
          \tint error;
          \terror = vfs_fstatat(dfd, filename, &stat, flag);''',
                  '''\tstruct kstat stat;
          \tint error;
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          \terror = vfs_fstatat(dfd, filename, &stat, flag);''',
                  'fstatat64 hook'
              )

          # EXECVE HOOK (Linux >= 3.14)
          f = 'fs/exec.c'

          replace_once(
              f,
              '''static int do_execveat_common(int fd, struct filename *filename,
          \t\t\t      struct user_arg_ptr argv,
          \t\t\t      struct user_arg_ptr envp,
          \t\t\t      int flags)
          {
          \treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);
          }''',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          \t\t\t\tvoid *argv, void *envp, int *flags);
          __attribute__((hot))
          extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,
          \t\t\t\tvoid *argv, void *envp, int *flags, int *retval);
          #endif

          static int do_execveat_common(int fd, struct filename *filename,
          \t\t\t      struct user_arg_ptr argv,
          \t\t\t      struct user_arg_ptr envp,
          \t\t\t      int flags)
          {
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tint retval;
          \tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          \tretval = __do_execve_file(fd, filename, argv, envp, flags, NULL);
          \tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);
          \treturn retval;
          #else
          \treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);
          #endif
          }''',
              'execve hook'
          )

          # FACCESSAT HOOK (Linux 4.14 uses the pre-4.19 form)
          f = 'fs/open.c'

          replace_once(
              f,
              'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          \t\t\t\tint *mode, int *flags);
          #endif

          SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)''',
              'faccessat declaration'
          )

          replace_once(
              f,
              '''\tunsigned int lookup_flags = LOOKUP_FOLLOW;
          \tif (mode & ~S_IRWXO)''',
              '''\tunsigned int lookup_flags = LOOKUP_FOLLOW;
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          \tif (mode & ~S_IRWXO)''',
              'faccessat call'
          )

          # REBOOT HOOK
          f = 'kernel/reboot.c'

          replace_once(
              f,
              'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          #endif

          SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,''',
              'reboot declaration'
          )

          replace_once(
              f,
              '''\tchar buffer[256];
          \tint ret = 0;
          \t/* We only trust the superuser''',
              '''\tchar buffer[256];
          \tint ret = 0;
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif
          \t/* We only trust the superuser''',
              'reboot call'
          )

          print('All required manual hook patches applied.')
          PY

          git diff --check

      - name: Configure kernel and ReSukiSU
        run: |
          make O=out ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc-9 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            camellia_defconfig

          scripts/config --file out/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            -e KALLSYMS_ALL

          make O=out ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc-9 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -qx 'CONFIG_KALLSYMS_ALL=y' out/.config

      - name: Build kernel
        run: |
          set -euo pipefail

          make O=out -j"$(nproc)" ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc-9 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb 2>&1 | tee build.log

          test -s out/arch/arm64/boot/Image.gz-dtb

      - name: Package POCO A/B AnyKernel3 ZIP
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3

          cat > ak3/anykernel.sh <<'AK3'
          properties() { '
          kernel.string=POCO M3 Pro 5G OC + ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=camellian
          device.name2=camellia
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3

          cp out/arch/arm64/boot/Image.gz-dtb ak3/

          test -f ak3/META-INF/com/google/android/update-binary

          cd ak3
          zip -r9 ../camellian-oc-resukisu.zip . \
            -x '.git*' 'README.md' '*placeholder'

      - name: Validate ZIP
        run: |
          test -s camellian-oc-resukisu.zip
          unzip -t camellian-oc-resukisu.zip

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: camellian-oc-resukisu
          path: camellian-oc-resukisu.zip
          if-no-files-found: error
          retention-days: 7
