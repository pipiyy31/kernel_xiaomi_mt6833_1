
name: POCO M3 Pro 5G - OC + ReSukiSU FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: pipiyy31/kernel_xiaomi_mt6833_1
          ref: flyme
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            gcc-9-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev make \
            python3 zip git curl

          aarch64-linux-gnu-gcc-9 --version

      - name: Apply CPU and GPU overclock
        run: |
          python3 - <<'PY'
          import re

          cpu = 'drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6833/mtk_cpufreq_platform.c'
          s = open(cpu).read()

          s, n = re.subn(
              r'(\n[ \t]*)tag_pr_info\("%d, Settle time',
              r'\1lv = CPU_LEVEL_2; /* OC: B24G table */\1tag_pr_info("%d, Settle time',
              s, count=1
          )
          assert n == 1, 'CPU OC anchor missing'
          open(cpu, 'w').write(s)

          gpu = 'drivers/misc/mediatek/base/power/gpufreq_v1/mt6833/mtk_gpufreq_plat.c'
          s = open(gpu).read()

          s, n = re.subn(
              r'(\n[ \t]*)g_segment_min_opp_idx = NUM_OF_OPP_IDX - 1;',
              r'\1g_segment_max_opp_idx = 0; /* OC: full GPU OPP */\1g_segment_min_opp_idx = NUM_OF_OPP_IDX - 1;',
              s, count=1
          )
          assert n == 1, 'GPU OC anchor missing'
          open(gpu, 'w').write(s)

          print('CPU and GPU OC patches applied.')
          PY

      - name: Fix old kernel build issues
        run: |
          grep -rlE --include=Makefile --include=Kbuild --include='*.mk' \
            -- '-Werror([[:space:]]|$)' drivers sound |
            xargs -r sed -i -E 's/-Werror([[:space:]]|$)/\1/g' || true

          sed -i 's/#include <clk-mux.h>/#include "clk-mux.h"/' \
            drivers/clk/mediatek/clkdbg-mt6833.c

      - name: Integrate official ReSukiSU
        run: |
          curl -fLSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            -o /tmp/resukisu-setup.sh

          bash /tmp/resukisu-setup.sh

          test -L drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Apply ReSukiSU Linux 4.14 manual hooks
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          def patch(file, pattern, replacement, name):
              p = Path(file)
              s = p.read_text()
              updated, count = re.subn(
                  pattern, replacement, s, count=1,
                  flags=re.MULTILINE | re.DOTALL
              )
              if count != 1:
                  raise SystemExit(
                      f'{name}: expected 1 match, found {count}'
                  )
              p.write_text(updated)
              print('PATCH OK:', name)

          # STAT HOOK DECLARATIONS
          patch(
              'fs/stat.c',
              r'^#if !defined\(__ARCH_WANT_STAT64\) \|\| defined\(__ARCH_WANT_SYS_NEWFSTATAT\)$',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                                     const char __user **filename_user,
                                     int *flags);
          extern void ksu_handle_newfstat_ret(
              unsigned int *fd, struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd, struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)''',
              'stat declarations'
          )

          # NEWFSTATAT
          patch(
              'fs/stat.c',
              r'(SYSCALL_DEFINE4\(newfstatat,[\s\S]*?\n\tint error;\n)',
              r'''\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          ''',
              'newfstatat'
          )

          # NEWFSTAT RETURN
          patch(
              'fs/stat.c',
              r'(SYSCALL_DEFINE2\(newfstat,[\s\S]*?error = cp_new_stat\(&stat, statbuf\);\n)(\s*return error;)',
              r'''\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          \2''',
              'newfstat return'
          )

          # FSTAT64 RETURN
          patch(
              'fs/stat.c',
              r'(SYSCALL_DEFINE2\(fstat64,[\s\S]*?error = cp_new_stat64\(&stat, statbuf\);\n)(\s*return error;)',
              r'''\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          \2''',
              'fstat64 return'
          )

          # FSTATAT64
          patch(
              'fs/stat.c',
              r'(SYSCALL_DEFINE4\(fstatat64,[\s\S]*?\n\tint error;\n)',
              r'''\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          ''',
              'fstatat64'
          )

          # EXECVE DECLARATIONS
          patch(
              'fs/exec.c',
              r'^static int do_execveat_common\(',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(
              int *fd, struct filename **filename_ptr,
              void *argv, void *envp, int *flags);
          __attribute__((hot))
          extern int ksu_handle_post_execveat(
              int *fd, struct filename **filename_ptr,
              void *argv, void *envp, int *flags, int *retval);
          #endif

          static int do_execveat_common(''',
              'execve declarations'
          )

          # EXECVE BODY
          patch(
              'fs/exec.c',
              r'''static int do_execveat_common\(int fd, struct filename \*filename,
          \s+struct user_arg_ptr argv,
          \s+struct user_arg_ptr envp,
          \s+int flags\)
          \{
          \s*return __do_execve_file\(fd, filename, argv, envp, flags, NULL\);
          \}''',
              '''static int do_execveat_common(int fd, struct filename *filename,
                                        struct user_arg_ptr argv,
                                        struct user_arg_ptr envp,
                                        int flags)
          {
          #ifdef CONFIG_KSU_MANUAL_HOOK
              int retval;
              ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
              retval = __do_execve_file(fd, filename, argv, envp, flags, NULL);
              ksu_handle_post_execveat(
                  &fd, &filename, &argv, &envp, &flags, &retval);
              return retval;
          #else
              return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          #endif
          }''',
              'execveat body'
          )

          # FACCESSAT DECLARATION
          patch(
              'fs/open.c',
              r'^SYSCALL_DEFINE3\(faccessat,',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
              int *dfd, const char __user **filename_user,
              int *mode, int *flags);
          #endif

          SYSCALL_DEFINE3(faccessat,''',
              'faccessat declaration'
          )

          # FACCESSAT CALL
          patch(
              'fs/open.c',
              r'(SYSCALL_DEFINE3\(faccessat,[\s\S]*?\n\{\n)',
              r'''\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          ''',
              'faccessat call'
          )

          # REBOOT DECLARATION
          patch(
              'kernel/reboot.c',
              r'^SYSCALL_DEFINE4\(reboot,',
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
              int magic1, int magic2, unsigned int cmd, void __user **arg);
          #endif

          SYSCALL_DEFINE4(reboot,''',
              'reboot declaration'
          )

          # REBOOT CALL
          patch(
              'kernel/reboot.c',
              r'(SYSCALL_DEFINE4\(reboot,[\s\S]*?\n\tint ret = 0;\n)',
              r'''\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif
          ''',
              'reboot call'
          )

          # FINAL HOOK AUDIT
          checks = {
              'stat': ('fs/stat.c', 'ksu_handle_stat'),
              'newfstat': ('fs/stat.c', 'ksu_handle_newfstat_ret'),
              'fstat64': ('fs/stat.c', 'ksu_handle_fstat64_ret'),
              'execve': ('fs/exec.c', 'ksu_handle_execveat'),
              'post_execve': ('fs/exec.c', 'ksu_handle_post_execveat'),
              'faccessat': ('fs/open.c', 'ksu_handle_faccessat'),
              'reboot': ('kernel/reboot.c', 'ksu_handle_sys_reboot'),
          }

          for name, (file, symbol) in checks.items():
              if symbol not in Path(file).read_text():
                  raise SystemExit(f'MISSING HOOK: {name}')
              print('HOOK VERIFIED:', name)

          print('ALL REQUIRED MANUAL HOOKS PRESENT')
          PY

          # Do not fail on pre-existing trailing whitespace in this source tree.

      - name: Configure kernel and ReSukiSU
        run: |
          make O=out ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc-9 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            camellia_defconfig

          scripts/config --file out/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            -e KALLSYMS \
            -e KALLSYMS_ALL

          make O=out ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc-9 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -qx 'CONFIG_KALLSYMS_ALL=y' out/.config

      - name: Build kernel
        run: |
          set -euo pipefail

          make O=out -j"$(nproc)" ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc-9 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb 2>&1 | tee build.log

          test -s out/arch/arm64/boot/Image.gz-dtb

      - name: Prepare AnyKernel3 for POCO A/B
        run: |
          git clone --depth 1 \
            https://github.com/osm0sis/AnyKernel3 ak3

          cat > ak3/anykernel.sh <<'AK3'
          properties() { '
          kernel.string=POCO M3 Pro 5G OC + ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=camellian
          device.name2=camellia
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3

          cp out/arch/arm64/boot/Image.gz-dtb ak3/

          test -f ak3/META-INF/com/google/android/update-binary

          cd ak3
          zip -r9 ../camellian-oc-resukisu.zip . \
            -x '.git*' 'README.md' '*placeholder'

      - name: Verify ZIP
        run: |
          set -e
          test -s camellian-oc-resukisu.zip
          unzip -t camellian-oc-resukisu.zip
          unzip -l camellian-oc-resukisu.zip | grep -E \
            'Image.gz-dtb|anykernel.sh|update-binary'

      - name: Upload final kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: camellian-oc-resukisu
          path: camellian-oc-resukisu.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camellian-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
